  // Colours measured from the 4K UHD frames (see the repo README).
  const PHOSPHOR = [51, 229, 154]     // terminal text (frames 506/518/526 and the opening, hue ~154)
  const CURSOR = [178, 255, 254]      // block cursor core (opening frame, pale cyan-white)
  const LEAD = [236, 248, 253]        // the bright glyph at the foot of a drop (cool white)
  // Brightness -> colour ramp for the rain body (black -> measured body green -> bright).
  const RAMP = [
    [0.00, [0, 0, 0]],
    [0.15, [0, 38, 20]],
    [0.45, [2, 112, 66]],
    [0.75, [10, 165, 102]],
    [1.00, [14, 205, 128]],
  ]
  const LEVELS = 24

  const canvas = document.getElementById('screen')
  const ctx = canvas.getContext('2d')
  const halo = document.createElement('canvas')
  const hctx = halo.getContext('2d')
  const wide = document.createElement('canvas')
  const wctx = wide.getContext('2d')
  const haze = document.createElement('canvas')
  const zctx = haze.getContext('2d')

  const loadImage = src => new Promise((res, rej) => {
    const im = new Image()
    im.onload = () => res(im)
    im.onerror = rej
    im.src = src
  })

  const lerp = (a, b, t) => a + (b - a) * t
  function rampColor(b) {
    for (let i = 1; i < RAMP.length; i++) {
      const [x1, c1] = RAMP[i]
      const [x0, c0] = RAMP[i - 1]
      if (b <= x1) {
        const t = (b - x0) / (x1 - x0)
        return [0, 1, 2].map(k => Math.round(lerp(c0[k], c1[k], t)))
      }
    }
    return RAMP[RAMP.length - 1][1]
  }

  // A tinted copy of an atlas: the atlas is white-on-transparent, so
  // source-in paints the glyph shapes in `rgb`.
  function tint(img, rgb) {
    const c = document.createElement('canvas')
    c.width = img.width
    c.height = img.height
    const x = c.getContext('2d')
    x.drawImage(img, 0, 0)
    x.globalCompositeOperation = 'source-in'
    x.fillStyle = `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`
    x.fillRect(0, 0, c.width, c.height)
    return c
  }

  let W = 0, H = 0, DPR = 1
  let cellW = 18, cellH = 21, cols = 0, rows = 0
  let grid = null       // glyph index per cell
  let timers = null     // seconds until each cell's glyph changes
  let columns = []

  function layout() {
    // 1x is enough for a soft CRT look and keeps an unattended machine cool.
    DPR = 1
    W = Math.max(1, window.innerWidth)
    H = Math.max(1, window.innerHeight)
    canvas.width = Math.round(W * DPR)
    canvas.height = Math.round(H * DPR)
    halo.width = Math.max(1, Math.round(W / 4))
    halo.height = Math.max(1, Math.round(H / 4))
    wide.width = Math.max(1, Math.round(W / 10))
    wide.height = Math.max(1, Math.round(H / 10))
    haze.width = Math.max(1, Math.round(W / 28))
    haze.height = Math.max(1, Math.round(H / 28))
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0)
    // Film (4K frame of the opening titles, 1280 px wide): ~53 columns, glyph ink
    // ~20x28 px in a ~24x34 px cell. Columns nearly touch; rows have the gap.
    cellW = Math.max(14, Math.min(30, Math.round(W / 53)))
    cellH = Math.round(cellW * 1.42)
    cols = Math.ceil(W / cellW)
    rows = Math.ceil(H / cellH) + 1
    grid = new Uint8Array(cols * rows)
    timers = new Float32Array(cols * rows)
    for (let i = 0; i < grid.length; i++) {
      grid[i] = (Math.random() * RAIN.count) | 0
      timers[i] = Math.random() * 4
    }
    columns = []
    for (let c = 0; c < cols; c++) columns.push(newColumn())
  }

  function newColumn() {
    // Speed in rows/second, period between drop heads, and how much of that
    // period the trail fills (modulating it keeps drops from looking cloned
    // and leaves dark gaps, so drops in one column never collide).
    // Long periods keep the number of drop heads on screen near the film's
    // (about one white lead per five columns); long trails keep ~20 % lit.
    const period = rows * (1.6 + Math.random() * 2.4)
    return {
      speed: 7 + Math.random() * 9,
      period,
      trail: period * (0.55 + Math.random() * 0.4),
      phase: Math.random() * period,
      gain: 0.75 + Math.random() * 0.25,
      // In the film only some drop heads flare white; the rest end in bright green.
      lead: Math.random() < 0.7,
    }
  }

  // ---- Neo's terminal --------------------------------------------------------
  const SCRIPT = [
    { text: 'Wake up, Neo...', typed: true, hold: 3.2 },
    { text: 'The Matrix has you...', typed: true, hold: 3.2 },
    { text: 'Follow the white rabbit.', typed: true, hold: 3.6 },
    { text: 'Knock, knock, Neo.', typed: false, hold: 3.4 },
  ]
  // Per-character delays so the typing is uneven, like a person at a keyboard.
  const plan = []
  {
    let t = 1.4
    for (const line of SCRIPT) {
      const stamps = []
      for (let i = 0; i < line.text.length; i++) {
        stamps.push(t)
        if (line.typed) t += 0.06 + Math.random() * 0.12 + (line.text[i] === ' ' ? 0.08 : 0)
      }
      t += line.hold
      plan.push({ ...line, stamps, end: t })
      t += 0.5
    }
  }
  const CONSOLE_END = plan[plan.length - 1].end + 0.4

  function drawConsole(t, conTinted) {
    const line = plan.find(l => t >= l.stamps[0] - 1.4 && t < l.end + 0.5)
    const size = Math.max(18, Math.min(40, W / 30))
    const scale = size / CON.cellH
    const cw = CON.cellW * scale
    // The dashboard's nav and session panels paint above overlays, so on a
    // wide screen the terminal text starts where the chat surface usually is.
    const x0 = Math.round(W >= 1100 ? W * 0.4 : W * 0.06)
    const y0 = Math.round(H * 0.12)
    let shown = 0
    // Tight CRT halo around the phosphor text (the bloom pass adds the wide glow).
    ctx.shadowColor = 'rgba(51, 229, 154, 0.5)'
    ctx.shadowBlur = size * 0.2
    if (line && t < line.end) {
      for (const s of line.stamps) if (t >= s) shown++
      for (let i = 0; i < shown; i++) {
        const code = line.text.charCodeAt(i) - CON.first
        if (code < 0 || code >= CON.count) continue
        const sx = (code % CON.cols) * CON.cellW
        const sy = Math.floor(code / CON.cols) * CON.cellH
        ctx.drawImage(conTinted, sx, sy, CON.cellW, CON.cellH, x0 + i * cw, y0, cw, CON.cellH * scale)
      }
    }
    ctx.shadowBlur = 0
    // Block cursor (drawn after the bloom so its core is not blown out): solid,
    // blinking on a ~1 s cycle, one cell past the text, 1.17:1 like the film's.
    const ch = CON.cellH * scale * 0.78
    const cwid = ch / 1.17
    return { x: x0 + shown * cw + (cw - cwid) / 2, y: y0 + CON.cellH * scale * 0.14, w: cwid, h: ch, on: Math.floor(t / 0.53) % 2 === 0 }
  }

  function drawCursor(c) {
    if (!c || !c.on) return
    ctx.save()
    ctx.shadowColor = 'rgba(178, 255, 254, 0.7)'
    ctx.shadowBlur = c.h * 0.35
    ctx.fillStyle = `rgb(${CURSOR.join(',')})`
    ctx.fillRect(c.x, c.y, c.w, c.h)
    ctx.restore()
  }

  // Faint horizontal scanlines over the terminal text, as on Neo's CRT.
  let scan = null
  function scanlines() {
    if (!scan) {
      const p = document.createElement('canvas')
      p.width = 1
      p.height = 3
      const x = p.getContext('2d')
      x.fillStyle = 'rgba(0, 0, 0, 0.35)'
      x.fillRect(0, 2, 1, 1)
      scan = ctx.createPattern(p, 'repeat')
    }
    ctx.fillStyle = scan
    ctx.fillRect(0, 0, W, H)
  }

  // ---- Rain ------------------------------------------------------------------
  // Lead glyphs drawn this frame, redrawn after the bloom so their core keeps
  // the film's cool white instead of clipping to pure white.
  const leads = []
  function drawRain(dt, now, alpha, levels, lead) {
    // Size each glyph so its ink matches the film: ~83 % of the column, ~82 % of the row.
    const gw = cellW * 1.04 / RAIN.inkW
    const gh = cellH * 0.92 / RAIN.inkH
    leads.length = 0
    ctx.globalAlpha = alpha
    for (let c = 0; c < cols; c++) {
      const col = columns[c]
      const head = now * col.speed + col.phase
      const x = c * cellW + (cellW - gw) / 2
      for (let r = 0; r < rows; r++) {
        let d = (head - r) % col.period
        if (d < 0) d += col.period
        const i = c * rows + r
        timers[i] -= dt
        let b
        if (d < 1) b = col.lead ? 2 : col.gain
        else if (d < col.trail) b = Math.pow(1 - d / col.trail, 0.6) * col.gain
        else continue
        // The film shows few faint ghosts: a lit trail stays bright, then ends.
        if (b < 0.14) continue
        // Lit glyphs change symbol now and then; brighter ones more often.
        if (timers[i] <= 0) {
          grid[i] = (Math.random() * RAIN.count) | 0
          timers[i] = 0.4 + Math.random() * (b > 1 ? 0.3 : 3.5)
        }
        const g = grid[i]
        const sx = (g % RAIN.cols) * RAIN.cell
        const sy = Math.floor(g / RAIN.cols) * RAIN.cell
        const y = r * cellH + (cellH - gh) / 2
        const src = b > 1 ? lead : levels[Math.min(LEVELS - 1, Math.max(0, Math.round(b * (LEVELS - 1))))]
        ctx.drawImage(src, sx, sy, RAIN.cell, RAIN.cell, x, y, gw, gh)
        if (b > 1) leads.push(sx, sy, x, y)
      }
    }
    ctx.globalAlpha = 1
  }

  function redrawLeads(lead, gw, gh, alpha) {
    ctx.globalCompositeOperation = 'source-over'
    ctx.globalAlpha = alpha
    for (let k = 0; k < leads.length; k += 4) {
      ctx.drawImage(lead, leads[k], leads[k + 1], RAIN.cell, RAIN.cell, leads[k + 2], leads[k + 3], gw, gh)
    }
    ctx.globalAlpha = 1
  }

  // Cheap bloom: shrink the frame twice (smoothing blurs it) and add it back.
  // Console text is a single hue, so a strong additive bloom would clip green
  // first and push it toward cyan; it gets a light one.
  function bloom(halo1 = 0.45, wide1 = 0.45, haze1 = 0.5) {
    hctx.globalCompositeOperation = 'copy'
    hctx.drawImage(canvas, 0, 0, halo.width, halo.height)
    wctx.globalCompositeOperation = 'copy'
    wctx.drawImage(halo, 0, 0, wide.width, wide.height)
    zctx.globalCompositeOperation = 'copy'
    zctx.drawImage(wide, 0, 0, haze.width, haze.height)
    ctx.save()
    ctx.setTransform(1, 0, 0, 1, 0, 0)
    ctx.globalCompositeOperation = 'lighter'
    ctx.imageSmoothingEnabled = true
    ctx.globalAlpha = halo1
    ctx.drawImage(halo, 0, 0, canvas.width, canvas.height)
    ctx.globalAlpha = wide1
    ctx.drawImage(wide, 0, 0, canvas.width, canvas.height)
    // The film has a faint green haze between columns.
    ctx.globalAlpha = haze1
    ctx.drawImage(haze, 0, 0, canvas.width, canvas.height)
    ctx.restore()
  }

  Promise.all([loadImage(RAIN.src), loadImage(CON.src)]).then(([rainImg, conImg]) => {
    const levels = []
    for (let l = 0; l < LEVELS; l++) levels.push(tint(rainImg, rampColor(l / (LEVELS - 1))))
    const lead = tint(rainImg, LEAD)
    const conTinted = tint(conImg, PHOSPHOR)
    layout()
    window.addEventListener('resize', layout)
    canvas.classList.add('on')

    // Preview harness only: `#rain` skips the terminal intro, `#t=12.5` starts
    // the timeline 12.5 s in.
    const skip = location.hash === '#rain' ? CONSOLE_END + 3 : Number((/^#t=([0-9.]+)$/.exec(location.hash) || [])[1] || 0)
    const start = performance.now() - skip * 1000
    let last = start
    let acc = 0
    const FRAME = 1 / 24
    const SLEEP_AT = 30 * 60
    let raf = 0
    let stopped = false
    const stop = () => { stopped = true; cancelAnimationFrame(raf) }

    // Dismiss on real activity over the screensaver. A browser can fire a
    // synthetic mousemove when the frame appears under a still pointer, so
    // movement counts only after 1.5 s and beyond 8 px.
    let origin = null
    const shownAt = performance.now()
    const dismiss = () => {
      if (stopped) return
      stop()
      try { parent.postMessage({ type: 'theme:visibility', visible: false }, '*') } catch {}
    }
    window.addEventListener('pointermove', e => {
      if (performance.now() - shownAt < 1500) return
      if (!origin) { origin = [e.clientX, e.clientY]; return }
      if (Math.hypot(e.clientX - origin[0], e.clientY - origin[1]) > 8) dismiss()
    })
    window.addEventListener('pointerdown', e => { e.preventDefault(); dismiss() })
    window.addEventListener('wheel', dismiss, { passive: true })
    window.addEventListener('keydown', dismiss)
    function frame(ts) {
      const dt = Math.min(0.25, (ts - last) / 1000)
      last = ts
      acc += dt
      if (acc >= FRAME) {
        const t = (ts - start) / 1000
        const awake = (ts - shownAt) / 1000
        if (awake > SLEEP_AT && canvas.classList.contains('on')) {
          canvas.style.transition = 'opacity 3s linear'
          canvas.classList.remove('on')
          setTimeout(stop, 3200)
        }
        ctx.globalCompositeOperation = 'source-over'
        ctx.fillStyle = '#000'
        ctx.fillRect(0, 0, W, H)
        if (t < CONSOLE_END) {
          const cur = drawConsole(t, conTinted)
          bloom(0.3, 0.2, 0)
          scanlines()
          drawCursor(cur)
        } else {
          const rt = t - CONSOLE_END
          const fade = Math.min(1, rt / 1.5)
          drawRain(acc, rt, fade, levels, lead)
          bloom()
          redrawLeads(lead, cellW * 1.04 / RAIN.inkW, cellH * 0.92 / RAIN.inkH, fade)
        }
        acc = 0
      }
      if (!stopped) raf = requestAnimationFrame(frame)
    }
    raf = requestAnimationFrame(frame)
  }).catch(() => {})
})()
</script>
</body>
</html>
